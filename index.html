<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione Presenze 2026 — Seleziona Filiale</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  .logo{font-size:1.6rem;font-weight:800;color:#1f2937;margin-bottom:.4rem;text-align:center}
  .sub{font-size:.9rem;color:#6b7280;margin-bottom:2.5rem;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.25rem;max-width:900px;width:100%}
  .card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:1.75rem 1.5rem;text-align:center;cursor:pointer;text-decoration:none;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:.6rem}
  .card:hover{border-color:#4f46e5;box-shadow:0 8px 24px rgba(79,70,229,.15);transform:translateY(-3px)}
  .card .icon{font-size:2.4rem}
  .card .nome{font-size:1.05rem;font-weight:700;color:#1f2937}
  .card .desc{font-size:.75rem;color:#9ca3af}
  .card.seriate{border-color:#4f46e5;background:#f5f3ff}
  .card.seriate .nome{color:#4f46e5}
  .footer{margin-top:2.5rem;font-size:.72rem;color:#9ca3af;text-align:center}
</style>
</head>
<body>
  <div class="logo">🏭 Gestione Presenze 2026</div>
  <div class="sub">Seleziona la filiale da gestire</div>
  <div class="grid">
    <a class="card seriate" href="seriate.html">
      <div class="icon">🏢</div>
      <div class="nome">SERIATE</div>
      <div class="desc">Bergamo</div>
    </a>
    <a class="card" href="pomezia.html">
      <div class="icon">🏢</div>
      <div class="nome">POMEZIA</div>
      <div class="desc">Roma</div>
    </a>
    <a class="card" href="orio.html">
      <div class="icon">🏢</div>
      <div class="nome">ORIO</div>
      <div class="desc">Bergamo</div>
    </a>
    <a class="card" href="perugia.html">
      <div class="icon">🏢</div>
      <div class="nome">PERUGIA</div>
      <div class="desc">Umbria</div>
    </a>
    <a class="card" href="elmas.html">
      <div class="icon">🏢</div>
      <div class="nome">ELMAS</div>
      <div class="desc">Cagliari</div>
    </a>
    <a class="card" href="modugno.html">
      <div class="icon">🏢</div>
      <div class="nome">MODUGNO</div>
      <div class="desc">Bari</div>
    </a>
  </div>
  <div class="footer">Gestione Presenze 2026 · Tutti i dati sono salvati su Firebase per ogni filiale separatamente</div>
</body>
</html>
