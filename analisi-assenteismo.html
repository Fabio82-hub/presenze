<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analisi Assenteismo — Gestione Presenze 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#4f46e5;--ok:#059669;--warn:#d97706;--danger:#dc2626;--border:#e5e7eb;--surface:#f8fafc;--text:#1f2937;--text2:#6b7280}
body{font-family:"Inter",sans-serif;background:#f1f5f9;color:var(--text)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:.5rem}
.hdr-title{font-size:1.1rem;font-weight:800}.hdr-sub{font-size:.72rem;color:var(--text2)}
.main{max-width:1300px;margin:0 auto;padding:1.5rem}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.ct{font-size:.85rem;font-weight:700;margin-bottom:.9rem;padding-bottom:.55rem;border-bottom:1px solid var(--border)}
.fr{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:.3rem}
label.lbl{font-size:.68rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.4rem}
input,select{border:1.5px solid var(--border);border-radius:8px;padding:.5rem .75rem;font-size:.82rem;font-family:"Inter",sans-serif;outline:none;color:var(--text);transition:border-color .15s;background:#fff}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:8px;font-family:"Inter",sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;border:none;transition:all .12s;white-space:nowrap}
.bp{background:var(--accent);color:#fff}.bp:hover{background:#4338ca;transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.3)}
.bg{background:#f1f5f9;color:var(--text);border:1.5px solid var(--border)}.bg:hover{background:#e5e7eb}
.btn-sm{padding:.28rem .6rem;font-size:.67rem}

/* CHIP FILIALE */
.filiali-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;margin-top:.4rem}
.fil-card{border:2px solid var(--border);border-radius:10px;padding:.65rem .8rem;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:.5rem;user-select:none;background:#fff}
.fil-card:hover{border-color:#a5b4fc;background:#f0f4ff}
.fil-card.selected{border-color:var(--accent);background:#eef2ff;color:var(--accent)}
.fil-card .fil-icon{font-size:1.1rem}
.fil-card .fil-nome{font-size:.78rem;font-weight:700}
.fil-card .fil-check{margin-left:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.55rem;transition:all .15s}
.fil-card.selected .fil-check{background:var(--accent);border-color:var(--accent);color:#fff}

/* CHIP MESE */
.mesi-grid{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem}
.mese-chip{border:2px solid var(--border);border-radius:8px;padding:.35rem .6rem;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s;user-select:none;background:#fff;color:var(--text2)}
.mese-chip:hover{border-color:#a5b4fc;color:var(--accent)}
.mese-chip.selected{border-color:var(--accent);background:#eef2ff;color:var(--accent)}
.mese-chip.trimestre{background:#f0fdf4;border-color:#86efac;color:#15803d}
.periodo-btns{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}

/* CHIUSURE */
.chiusura-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .75rem;background:#fff8f0;border:1px solid #fed7aa;border-radius:8px;margin-bottom:.4rem;font-size:.75rem}
.chiusura-item .chi-label{font-weight:600;color:#92400e}
.chiusura-item .chi-date{color:#c2410c}
.chiusura-item .chi-del{margin-left:auto;background:none;border:none;cursor:pointer;color:#dc2626;font-size:.85rem;padding:.1rem .3rem;border-radius:4px}
.chiusura-item .chi-del:hover{background:#fee2e2}

/* RISULTATI */
.tabs{display:flex;gap:.2rem;border-bottom:2px solid var(--border);margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:.55rem 1rem;font-size:.76rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;border-radius:6px 6px 0 0}
.tab:hover{background:#f1f5f9;color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#f5f3ff}
.tab-content{display:none}.tab-content.active{display:block}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.7rem;margin-bottom:1rem}
.kpi{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:.9rem;text-align:center;position:relative;overflow:hidden;transition:box-shadow .15s}
.kpi:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.kpi::before{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--kc,#e5e7eb)}
.kpi-val{font-size:1.75rem;font-weight:800;line-height:1;color:var(--kc,var(--text))}
.kpi-label{font-size:.62rem;color:var(--text2);margin-top:.3rem;line-height:1.35}
.kpi.ok{--kc:#059669}.kpi.warn{--kc:#d97706}.kpi.danger{--kc:#dc2626}.kpi.accent{--kc:#4f46e5}.kpi.purple{--kc:#7c3aed}.kpi.pink{--kc:#be185d}

table{width:100%;border-collapse:collapse;font-size:.76rem}
th{text-align:left;padding:.42rem .65rem;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);border-bottom:2px solid var(--border);background:var(--surface)}
td{padding:.48rem .65rem;border-bottom:1px solid #f3f4f6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-flex;align-items:center;padding:.13rem .45rem;border-radius:20px;font-size:.62rem;font-weight:700}
.b-ok{background:#d1fae5;color:#065f46}.b-warn{background:#fef3c7;color:#92400e}.b-danger{background:#fee2e2;color:#991b1b}
.b-info{background:#dbeafe;color:#1e40af}.b-pink{background:#fce7f3;color:#be185d}.b-gray{background:#f1f5f9;color:#6b7280}
.progress-bar{background:#f1f5f9;border-radius:20px;height:6px;overflow:hidden;margin-top:.25rem;min-width:60px}
.progress-fill{height:100%;border-radius:20px;transition:width .5s}
.filiale-section{border-left:4px solid var(--accent);padding-left:1rem;margin-bottom:1.75rem}
.filiale-section-title{font-size:.88rem;font-weight:800;color:var(--accent);margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem}
.sep{margin:.65rem 0;border:none;border-top:1px solid var(--border)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #e5e7eb;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:.65rem .9rem;font-size:.76rem;color:#1e40af;margin-bottom:1rem}
@media print{.no-print{display:none!important}.card{break-inside:avoid}body{background:#fff}}
</style>

<body>
<div class="hdr">
  <div>
    <div class="hdr-title">📊 Analisi Assenteismo Multi-Filiale</div>

        <span class="spin"></span> Caricamento dati...
      </span>
      <button class="btn bp" id="btnAnal" onclick="eseguiAnalisi()" style="font-size:.88rem;padding:.65rem 1.75rem">
        ▶ Esegui analisi
      </button>
    </div>
  </div>

  <!-- RISULTATI -->
  <div id="results" style="display:none">
    <div class="tabs">
      <button class="tab active" data-tab="confronto" onclick="openTab('confronto')">🏭 Confronto filiali</button>
      <button class="tab" data-tab="riepilogo" onclick="openTab('riepilogo')">📊 Riepilogo</button>
      <button class="tab" data-tab="reparto" onclick="openTab('reparto')">🏢 Per reparto</button>

    <div id="confronto" class="tab-content active"><div id="tab-confronto"></div></div>
    <div id="riepilogo" class="tab-content"><div id="tab-riepilogo"></div></div>
    <div id="reparto" class="tab-content"><div id="tab-reparto"></div></div>
    <div id="dipendenti" class="tab-content"><div id="tab-dipendenti"></div></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDw6gFXrMA3hgShlk4S9XzYwBt2WGN6HKE",authDomain:"presenze2026.firebaseapp.com",projectId:"presenze2026",storageBucket:"presenze2026.firebasestorage.app",messagingSenderId:"1073603463859",appId:"1:1073603463859:web:23a1a363bbaabdc5077ec6"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const FILIALI=[
  {id:"seriate",nome:"SERIATE",emoji:"🏭"},
  {id:"pomezia",nome:"POMEZIA",emoji:"🏢"},
  {id:"orio",   nome:"ORIO",   emoji:"🏢"},
  {id:"perugia",nome:"PERUGIA",emoji:"🏢"},
  {id:"elmas",  nome:"ELMAS",  emoji:"🏢"},
  {id:"modugno",nome:"MODUGNO",emoji:"🏢"},
];
const MESI_B=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
const TIPI={
  ferie:     {label:"Ferie",       col:"#1e40af",reale:true, prev:false},
  rol:       {label:"ROL/Perm.",   col:"#065f46",reale:true, prev:false},
  malattia:  {label:"Malattia",    col:"#991b1b",reale:true, prev:false},
  t104:      {label:"L.104",       col:"#14532d",reale:true, prev:false},
  mancata:   {label:"Manc.",       col:"#854d0e",reale:false,prev:false},
  ferie_prev:{label:"Ferie Prev.", col:"#be185d",reale:false,prev:true},
  rol_prev:  {label:"ROL Prev.",   col:"#0369a1",reale:false,prev:true},
};

let chiusure=[], cacheS={};
let filSel=new Set(["seriate"]), mesiSel=new Set([7]);

// ── INIT UI ──────────────────────────────────────────
function buildUI(){
  // Filiali
  const fg=document.getElementById("filialiGrid");
  fg.innerHTML=FILIALI.map(f=>`
    <div class="fil-card ${filSel.has(f.id)?"selected":""}" id="fil-${f.id}" onclick="toggleFiliale('${f.id}')">
      <span class="fil-icon">${f.emoji}</span>
      <span class="fil-nome">${f.nome}</span>
      <span class="fil-check">${filSel.has(f.id)?"✓":""}</span>
    </div>`).join("");

  // Mesi
  const mg=document.getElementById("mesiGrid");
  mg.innerHTML=MESI_B.map((m,i)=>`
    <div class="mese-chip ${mesiSel.has(i)?"selected":""}" id="mese-${i}" onclick="toggleMese(${i})">${m}</div>`).join("");
}

window.toggleFiliale=function(id){
  if(filSel.has(id))filSel.delete(id); else filSel.add(id);
  const el=document.getElementById("fil-"+id);
  el.classList.toggle("selected",filSel.has(id));
  el.querySelector(".fil-check").textContent=filSel.has(id)?"✓":"";
};
window.selFiliali=function(all){
  if(all) FILIALI.forEach(f=>filSel.add(f.id)); else filSel.clear();
  buildUI();
};
window.toggleMese=function(i){
  if(mesiSel.has(i))mesiSel.delete(i); else mesiSel.add(i);
  const el=document.getElementById("mese-"+i);
  el.classList.toggle("selected",mesiSel.has(i));
};
window.selMesi=function(arr){
  mesiSel.clear();
  arr.forEach(i=>mesiSel.add(i));
  MESI_B.forEach((_,i)=>{
    const el=document.getElementById("mese-"+i);
    if(el) el.classList.toggle("selected",mesiSel.has(i));
  });
};

// ── CHIUSURE ──────────────────────────────────────────
window.aggiungiChiusura=function(){
  const dal=document.getElementById("cDal").value;
  const al=document.getElementById("cAl").value;
  const label=document.getElementById("cLabel").value||"Chiusura aziendale";
  if(!dal||!al){alert("Inserisci data inizio e fine.");return;}
  if(dal>al){alert("Data inizio deve essere prima della fine.");return;}
  chiusure.push({dal,al,label});renderChiusure();
  document.getElementById("cDal").value="";
  document.getElementById("cAl").value="";
  document.getElementById("cLabel").value="";
};
window.rimuoviChiusura=function(i){chiusure.splice(i,1);renderChiusure();};
function renderChiusure(){
  const el=document.getElementById("chiusureList");
  if(!chiusure.length){el.innerHTML="<span style='color:var(--text2);font-size:.73rem'>Nessuna chiusura inserita</span>";return;}
  el.innerHTML=chiusure.map((c,i)=>`
    <div class="chiusura-item">
      <span class="chi-label">${c.label}</span>
      <span class="chi-date">${c.dal.split("-").reverse().join("/")} → ${c.al.split("-").reverse().join("/")}</span>
      <button class="chi-del" onclick="rimuoviChiusura(${i})">✕ Rimuovi</button>
    </div>`).join("");
}

// ── HELPERS ──────────────────────────────────────────
function isoD(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function localDS(dt){return isoD(dt.getFullYear(),dt.getMonth(),dt.getDate());}
function fmt(v,d=1){v=parseFloat(v)||0;return v%1===0?v.toFixed(0):v.toFixed(d).replace(/\.?0+$/,"");}
function cls(p){return p<=5?"ok":p<=10?"warn":"danger";}
function bcls(p){return p<=5?"b-ok":p<=10?"b-warn":"b-danger";}

function isFestivo(ds){
  const[y,m,d]=ds.split("-").map(Number);
  const fisse=[[1,1],[6,1],[25,4],[1,5],[2,6],[15,8],[1,11],[8,12],[25,12],[26,12]];
  if(fisse.some(([dd,mm])=>mm===m&&dd===d))return true; // array in formato [giorno,mese]: FIX bug inversione giorno/mese
  const a=y%19,b=Math.floor(y/100),c=y%100,d2=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d2-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m2=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m2+114)/31),day2=(h+l-7*m2+114)%31+1;
  const pasqua=isoD(y,month-1,day2);
  const pm=new Date(pasqua+"T00:00:00");pm.setDate(pm.getDate()+1);
  return ds===pasqua||ds===localDS(pm);
}
function isChiusura(ds){return chiusure.some(c=>ds>=c.dal&&ds<=c.al);}
function isLav(ds){const w=new Date(ds+"T00:00:00").getDay();return w!==0&&w!==6&&!isFestivo(ds)&&!isChiusura(ds);}

function getGiorniLav(anno,mesi){
  const gg=[];
  [...mesi].sort((a,b)=>a-b).forEach(m=>{
    let cur=new Date(anno,m,1);
    while(cur.getMonth()===m){const ds=localDS(cur);if(isLav(ds))gg.push(ds);cur.setDate(cur.getDate()+1);}
  });
  return gg;
}

function calcFiliale(S,anno,mesi){
  const dips=(S.dipendenti||[]).filter(d=>!d.cessato);
  const ents=S.entries||[];
  const gg=getGiorniLav(anno,mesi);
  const nG=gg.length,nD=dips.length,oreDisp=nD*8*nG;
  const primo=gg[0]||"",ultimo=gg[gg.length-1]||"";
  const perTipo={},perRep={},perDip={};
  dips.forEach(d=>{
    perDip[d.id]={nome:d.nome,rep:d.reparto,oR:0,oP:0,tipi:{}};
    if(!perRep[d.reparto])perRep[d.reparto]={dip:0,oreDisp:0,oR:0,oP:0};
    perRep[d.reparto].dip++;
    perRep[d.reparto].oreDisp+=8*nG;
  });
  let oreR=0,oreP=0;
  ents.forEach(e=>{
    if(!e.data||e.data<primo||e.data>ultimo)return;
    const[y,m]=e.data.split("-").map(Number);
    if(y!==anno||![...mesi].includes(m-1))return;
    if(!isLav(e.data))return;
    const cfg=TIPI[e.tipo];if(!cfg)return;
    const dip=dips.find(d=>d.id===e.dipId);if(!dip)return;
    const ore=e.tipo==="malattia"?8:e.tipo==="mancata"?0:(parseFloat(e.ore)||0);
    if(!perTipo[e.tipo])perTipo[e.tipo]={...cfg,ore:0,eventi:0};
    perTipo[e.tipo].ore+=ore;perTipo[e.tipo].eventi++;
    if(cfg.reale){oreR+=ore;perDip[e.dipId].oR+=ore;perRep[dip.reparto].oR+=ore;}
    if(cfg.prev) {oreP+=ore;perDip[e.dipId].oP+=ore;perRep[dip.reparto].oP+=ore;}
    if(!perDip[e.dipId].tipi[e.tipo])perDip[e.dipId].tipi[e.tipo]=0;
    perDip[e.dipId].tipi[e.tipo]+=ore;
  });
  return{nD,nG,oreDisp,oreR,oreP,perTipo,perRep,perDip};
}

window.openTab=function(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelector(`.tab[data-tab="${id}"]`).classList.add("active");
  document.getElementById(id).classList.add("active");
};

window.eseguiAnalisi=async function(){
  const anno=parseInt(document.getElementById("annoSel").value)||2026;
  if(!mesiSel.size){alert("Seleziona almeno un mese.");return;}
  if(!filSel.size){alert("Seleziona almeno una filiale.");return;}
  const mesi=[...mesiSel];
  const labP=mesi.length===12?"Anno "+anno:[...mesi].sort((a,b)=>a-b).map(m=>MESI_B[m]).join(", ")+" "+anno;

  const btn=document.getElementById("btnAnal");
  const lm=document.getElementById("loadMsg");
  btn.disabled=true;btn.innerHTML="<span class=\"spin\"></span> Analisi...";
  lm.style.display="inline-flex";

  const dati={};
  await Promise.all([...filSel].map(async fid=>{
    if(!cacheS[fid]){
      const snap=await getDoc(doc(db,"stato",fid));
      cacheS[fid]=snap.exists()?snap.data():{dipendenti:[],entries:[]};
    }
    dati[fid]=calcFiliale(cacheS[fid],anno,mesiSel);
  }));
  btn.disabled=false;btn.innerHTML="▶ Esegui analisi";lm.style.display="none";

  const filArr=[...filSel];

  // ── CONFRONTO FILIALI ──────────────────────────────
  let totD=0,totDisp=0,totR=0,totP=0;
  filArr.forEach(fid=>{const v=dati[fid];totD+=v.nD;totDisp+=v.oreDisp;totR+=v.oreR;totP+=v.oreP;});
  const pRT=totDisp>0?(totR/totDisp)*100:0;
  const pPT=totDisp>0?(totP/totDisp)*100:0;
  const pTT=totDisp>0?((totR+totP)/totDisp)*100:0;

  let confHtml=`
    <div class="kpi-grid" style="margin-bottom:1.25rem">
      <div class="kpi accent"><div class="kpi-val">${totD}</div><div class="kpi-label">Dipendenti totali</div></div>
      <div class="kpi"><div class="kpi-val">${fmt(totDisp)}h</div><div class="kpi-label">Ore disponibili totali</div></div>
      <div class="kpi danger"><div class="kpi-val">${fmt(totR)}h</div><div class="kpi-label">Ore assenza reali</div></div>
      <div class="kpi pink"><div class="kpi-val">${fmt(totP)}h</div><div class="kpi-label">Ore previsionali</div></div>
      <div class="kpi ${cls(pRT)}"><div class="kpi-val">${fmt(pRT)}%</div><div class="kpi-label">% Assent. reale</div></div>
      <div class="kpi pink"><div class="kpi-val">${fmt(pPT)}%</div><div class="kpi-label">% Previsionali</div></div>
      <div class="kpi ${cls(pTT)}"><div class="kpi-val">${fmt(pTT)}%</div><div class="kpi-label">% Totale</div></div>
    </div>
    <div class="card"><div class="ct">Confronto filiali — ${labP}</div>
    <table><thead><tr>
      <th>Filiale</th><th style="text-align:center">Dip.</th><th style="text-align:right">Ore disp.</th>
      <th style="text-align:right">Ore reali</th><th style="text-align:right">% reale</th>
      <th style="text-align:right">Ore prev.</th><th style="text-align:right">% prev.</th>
      <th style="text-align:right">% totale</th>
    </tr></thead><tbody>`;
  filArr.forEach(fid=>{
    const f=FILIALI.find(x=>x.id===fid);
    const v=dati[fid];
    const pR=v.oreDisp>0?(v.oreR/v.oreDisp)*100:0;
    const pP=v.oreDisp>0?(v.oreP/v.oreDisp)*100:0;
    const pT=v.oreDisp>0?((v.oreR+v.oreP)/v.oreDisp)*100:0;
    confHtml+=`<tr>
      <td><b>${f.emoji} ${f.nome}</b></td>
      <td style="text-align:center">${v.nD}</td>
      <td style="text-align:right;font-family:monospace">${fmt(v.oreDisp)}h</td>
      <td style="text-align:right;font-family:monospace;color:#dc2626">${fmt(v.oreR)}h</td>
      <td style="text-align:right"><span class="badge ${bcls(pR)}">${fmt(pR)}%</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(pR*5,100)}%;background:#dc2626"></div></div></td>
      <td style="text-align:right;font-family:monospace;color:#be185d">${fmt(v.oreP)}h</td>
      <td style="text-align:right"><span class="badge b-pink">${fmt(pP)}%</span></td>
      <td style="text-align:right"><span class="badge ${bcls(pT)}">${fmt(pT)}%</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(pT*5,100)}%;background:#4f46e5"></div></div></td>
    </tr>`;
  });
  confHtml+="</tbody></table></div>";
  document.getElementById("tab-confronto").innerHTML=confHtml;

  // ── RIEPILOGO PER FILIALE ──────────────────────────
  let riepHtml="";
  filArr.forEach(fid=>{
    const f=FILIALI.find(x=>x.id===fid);
    const v=dati[fid];
    const pR=v.oreDisp>0?(v.oreR/v.oreDisp)*100:0;
    const pP=v.oreDisp>0?(v.oreP/v.oreDisp)*100:0;
    const pT=v.oreDisp>0?((v.oreR+v.oreP)/v.oreDisp)*100:0;
    const tipiRows=Object.entries(v.perTipo).sort((a,b)=>b[1].ore-a[1].ore).map(([tipo,tv])=>{
      const p=v.oreDisp>0?(tv.ore/v.oreDisp)*100:0;
      const natura=tv.prev?"<span class=\"badge b-pink\">Previsionale</span>":tv.reale?"<span class=\"badge b-info\">Reale</span>":"<span class=\"badge b-gray\">Info</span>";
      return `<tr><td><span style="display:inline-block;width:8px;height:8px;background:${tv.col};border-radius:50%;margin-right:.4rem"></span>${tv.label}</td>
        <td style="text-align:right">${tv.eventi}</td>
        <td style="text-align:right;font-family:monospace">${fmt(tv.ore)}h</td>
        <td style="text-align:right">${tv.reale||tv.prev?`<span class="badge ${tv.prev?"b-pink":bcls(p)}">${fmt(p)}%</span>`:"—"}</td>
        <td>${natura}</td></tr>`;
    }).join("");
    riepHtml+=`<div class="filiale-section">
      <div class="filiale-section-title">${f.emoji} ${f.nome}</div>
      <div class="kpi-grid">
        <div class="kpi accent"><div class="kpi-val">${v.nD}</div><div class="kpi-label">Dipendenti</div></div>
        <div class="kpi accent"><div class="kpi-val">${v.nG}</div><div class="kpi-label">Giorni lav.</div></div>
        <div class="kpi"><div class="kpi-val">${fmt(v.oreDisp)}h</div><div class="kpi-label">Ore disponibili</div></div>
        <div class="kpi danger"><div class="kpi-val">${fmt(v.oreR)}h</div><div class="kpi-label">Ore assenza reali</div></div>
        <div class="kpi pink"><div class="kpi-val">${fmt(v.oreP)}h</div><div class="kpi-label">Ore previsionali</div></div>
        <div class="kpi ${cls(pR)}"><div class="kpi-val">${fmt(pR)}%</div><div class="kpi-label">% Assent. reale</div></div>
        <div class="kpi pink"><div class="kpi-val">${fmt(pP)}%</div><div class="kpi-label">% Previsionali</div></div>
        <div class="kpi ${cls(pT)}"><div class="kpi-val">${fmt(pT)}%</div><div class="kpi-label">% Totale</div></div>
      </div>
      <div class="card"><div class="ct">Distribuzione per tipo</div>
      <table><thead><tr><th>Tipo</th><th style="text-align:right">N.eventi</th><th style="text-align:right">Ore</th><th style="text-align:right">%</th><th>Natura</th></tr></thead>
      <tbody>${tipiRows||"<tr><td colspan=\"5\" style=\"text-align:center;color:#9ca3af\">Nessuna assenza</td></tr>"}</tbody></table></div>
    </div>`;
  });
  document.getElementById("tab-riepilogo").innerHTML=riepHtml;

  // ── PER REPARTO ──────────────────────────────────
  let repHtml="";
  filArr.forEach(fid=>{
    const f=FILIALI.find(x=>x.id===fid);
    const v=dati[fid];
    const rows=Object.entries(v.perRep).filter(([,r])=>r.oR>0||r.oP>0)
      .sort((a,b)=>b[1].oR-a[1].oR).map(([rep,r])=>{
        const pR=r.oreDisp>0?(r.oR/r.oreDisp)*100:0;
        const pP=r.oreDisp>0?(r.oP/r.oreDisp)*100:0;
        const pT=r.oreDisp>0?((r.oR+r.oP)/r.oreDisp)*100:0;
        const rb=rep.replace("SERIATE REPARTO ","").replace("AREA SERIATE ","");
        return `<tr><td><b>${rb}</b></td><td style="text-align:center">${r.dip}</td>
          <td style="text-align:right;font-family:monospace">${fmt(r.oreDisp)}h</td>
          <td style="text-align:right;font-family:monospace;color:#dc2626">${fmt(r.oR)}h</td>
          <td style="text-align:right"><span class="badge ${bcls(pR)}">${fmt(pR)}%</span></td>
          <td style="text-align:right;font-family:monospace;color:#be185d">${fmt(r.oP)}h</td>
          <td style="text-align:right"><span class="badge b-pink">${fmt(pP)}%</span></td>
          <td style="text-align:right"><span class="badge ${bcls(pT)}">${fmt(pT)}%</span></td></tr>`;
      }).join("");
    repHtml+=`<div class="filiale-section"><div class="filiale-section-title">${f.emoji} ${f.nome}</div>
      <div class="card"><table><thead><tr><th>Reparto</th><th style="text-align:center">Dip.</th>
        <th style="text-align:right">Ore disp.</th><th style="text-align:right">Ore reali</th>
        <th style="text-align:right">% reale</th><th style="text-align:right">Ore prev.</th>
        <th style="text-align:right">% prev.</th><th style="text-align:right">% tot.</th>
      </tr></thead><tbody>${rows||"<tr><td colspan=\"8\" style=\"text-align:center;color:#9ca3af\">Nessun dato</td></tr>"}</tbody></table></div></div>`;
  });
  document.getElementById("tab-reparto").innerHTML=repHtml;

  // ── PER DIPENDENTE ──────────────────────────────────
  let dipHtml="";
  filArr.forEach(fid=>{
    const f=FILIALI.find(x=>x.id===fid);
    const v=dati[fid];
    const oi=8*v.nG;
    const rows=Object.values(v.perDip).filter(d=>d.oR>0||d.oP>0)
      .sort((a,b)=>(b.oR+b.oP)-(a.oR+a.oP)).slice(0,30).map((d,i)=>{
        const pR=oi>0?(d.oR/oi)*100:0,pP=oi>0?(d.oP/oi)*100:0,pT=oi>0?((d.oR+d.oP)/oi)*100:0;
        const rb=d.rep.replace("SERIATE REPARTO ","").replace("AREA SERIATE ","");
        const det=Object.entries(d.tipi).filter(([,o])=>o>0)
          .map(([t,o])=>`<span style="color:${TIPI[t]?.col||"#666"};font-size:.6rem">${TIPI[t]?.label||t} ${fmt(o)}h</span>`).join(" · ");
        return `<tr>
          <td style="color:var(--text2);font-size:.7rem">${i+1}</td>
          <td><b style="font-size:.78rem">${d.nome}</b><br><span style="font-size:.6rem;color:var(--text2)">${rb}</span></td>
          <td style="text-align:right;font-family:monospace;color:#dc2626">${fmt(d.oR)}h</td>
          <td><span class="badge ${bcls(pR)}">${fmt(pR)}%</span></td>
          <td style="text-align:right;font-family:monospace;color:#be185d">${fmt(d.oP)}h</td>
          <td><span class="badge b-pink">${fmt(pP)}%</span></td>
          <td><span class="badge ${bcls(pT)}">${fmt(pT)}%</span></td>
          <td style="font-size:.6rem;color:var(--text2);max-width:200px">${det}</td></tr>`;
      }).join("");
    dipHtml+=`<div class="filiale-section"><div class="filiale-section-title">${f.emoji} ${f.nome} — top 30 (${oi}h/dip.)</div>
      <div class="card"><div style="overflow-x:auto"><table><thead><tr>
        <th>#</th><th>Nominativo</th>
        <th style="text-align:right">Ore reali</th><th>% reale</th>
        <th style="text-align:right">Ore prev.</th><th>% prev.</th>
        <th>% tot.</th><th>Dettaglio</th>
      </tr></thead><tbody>${rows||"<tr><td colspan=\"8\" style=\"text-align:center;color:#9ca3af\">Nessuna assenza</td></tr>"}</tbody></table></div></div></div>`;
  });
  document.getElementById("tab-dipendenti").innerHTML=dipHtml;

  document.getElementById("results").style.display="block";
  openTab("confronto");
};

window.addEventListener("DOMContentLoaded",()=>{
  buildUI();
  chiusure=[{dal:"2026-08-14",al:"2026-08-21",label:"Chiusura estiva"}];
  renderChiusure();
});
</script>
</body>
