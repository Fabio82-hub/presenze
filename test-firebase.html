<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Firebase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;padding:2rem;background:#f1f5f9}
.box{background:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1rem;border:1px solid #e5e7eb}
.ok{color:#059669;font-weight:700} .err{color:#dc2626;font-weight:700} .warn{color:#d97706;font-weight:700}
pre{background:#f8fafc;padding:.75rem;border-radius:6px;font-size:.75rem;overflow-x:auto;border:1px solid #e5e7eb}
</style>
</head>
<body>
<h2 style="margin-bottom:1rem">🔍 Test connessione Firebase — presenze2026</h2>
<div class="box" id="out">⏳ Test in corso...</div>
<div class="box"><pre id="log"></pre></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const log = (msg, cls='') => {
  const pre = document.getElementById('log');
  pre.innerHTML += `<span class="${cls}">${msg}</span>\n`;
};

const out = (msg, cls='') => {
  document.getElementById('out').innerHTML = `<span class="${cls}">${msg}</span>`;
};

try {
  log('1. Inizializzazione Firebase...');
  const app = initializeApp({
    apiKey: "AIzaSyDw6gFXrMA3hgShlk4S9XzYwBt2WGN6HKE",
    authDomain: "presenze2026.firebaseapp.com",
    projectId: "presenze2026",
    storageBucket: "presenze2026.firebasestorage.app",
    messagingSenderId: "1073603463859",
    appId: "1:1073603463859:web:23a1a363bbaabdc5077ec6"
  });
  log('✅ Firebase inizializzato', 'ok');

  log('2. Connessione Firestore...');
  const db = getFirestore(app);
  log('✅ Firestore connesso', 'ok');

  log('3. Lettura documento stato/seriate...');
  const snap = await getDoc(doc(db, 'stato', 'seriate'));
  
  if(snap.exists()){
    const d = snap.data();
    const ndip = (d.dipendenti||[]).length;
    const nent = (d.entries||[]).length;
    log(`✅ Documento trovato! Dipendenti: ${ndip}, Entries: ${nent}`, 'ok');
    out(`✅ Connessione OK — ${ndip} dipendenti, ${nent} assenze`, 'ok');
  } else {
    log('⚠️ Documento stato/seriate NON esiste ancora', 'warn');
    out('⚠️ Documento non trovato — sarà creato al primo accesso', 'warn');
  }

} catch(e) {
  log(`❌ ERRORE: ${e.code} — ${e.message}`, 'err');
  out(`❌ Errore: ${e.message}`, 'err');
  
  if(e.code === 'permission-denied') {
    log('→ CAUSA: Regole Firestore bloccano la lettura. Aggiorna le regole su console.firebase.google.com', 'warn');
  } else if(e.code === 'unavailable') {
    log('→ CAUSA: Firebase non raggiungibile. Controlla la connessione internet.', 'warn');
  } else if(e.message?.includes('api-key')) {
    log('→ CAUSA: ApiKey non valida o progetto Firebase disabilitato.', 'warn');
  }
}
</script>
</body>
</html>
